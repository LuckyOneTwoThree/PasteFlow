name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Gates (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --lib --workspace

      # 三套 CI 测试门禁 (Dev Plan §5)
      - name: Gate 1/3 l1_snapshots
        run: cargo test --test l1_snapshots

      - name: Gate 2/3 guardrails
        run: cargo test --test guardrails

      - name: Gate 3/3 hotkey_registry
        run: cargo test --test hotkey_registry
