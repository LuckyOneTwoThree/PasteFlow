[package]
name = "pasteflow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "pasteflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pasteflow"
path = "src/main.rs"

# v0.1.0 极简版依赖集 (Dev Plan P1): 仅核心引擎所需
# - 不含 rusqlite (SQLite/FTS5 -> v0.1.5 P2 抽屉)
# - 不含 enigo (L3 注入 -> v0.1.5 P3)
# - 不含 scraper/url (L3 流式网页清洗 -> v0.1.5 P3)
[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
parking_lot = "0.12"
blake3 = "1.5"
regex = "1.11"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# P2-4 SQLite/FTS5 存储层 (v0.1.5 历史抽屉)
# FTS5 由 libsqlite3-sys bundled 模式默认编译 (SQLITE_ENABLE_FTS5)
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
# P3-3 开发者瑞士军刀 (JWT/Base64 解码 + 时间戳转 ISO 8601)
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
# P3-1 L3 网络层: OpenAI 兼容 SSE 流式客户端 (BYOK + 本地 Ollama 探测)
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSData", "NSString", "NSDictionary"] }
objc2-app-kit = { version = "0.2", features = [
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPanel",
    "NSResponder",
    "NSWindow",
    "NSApplication"
] }
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
