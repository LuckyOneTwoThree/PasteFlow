<!doctype html>
<!--
  PasteFlow Micro-HUD (UI Spec v1.0 §3 / IPC Spec v1.0 `/#/hud`)
  零依赖原生 HTML/CSS/JS 页面，由 micro-hud WebviewWindow 常驻隐藏加载。
  按键: 1–4 触发动作槽 / 0·Backspace 还原原文 / ↑↓·Tab 循环高亮 /
        Enter 执行高亮行 / Esc 隐藏 (自动挡不变)。按键绝不泄漏进宿主应用。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PasteFlow Micro-HUD</title>
<style>
  :root {
    --hud-bg: rgba(28, 28, 30, 0.94);
    --hud-fg: #f5f5f7;
    --hud-muted: #98989f;
    --hud-accent: #0a84ff;
    --hud-ready: #30d158;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  #panel {
    position: absolute; inset: 8px;
    background: var(--hud-bg);
    color: var(--hud-fg);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 16px 48px rgba(0,0,0,0.35);
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  #panel.visible { display: flex; }
  #panel.ready { outline: 2px solid var(--hud-ready); }
  /* P3-1: L3 流式预览展开态 (UI Spec §3.3) */
  #panel.streaming, #panel.l3-done {
    width: calc(100% - 16px);
  }
  .l3-preview {
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  #panel.streaming .l3-preview, #panel.l3-done .l3-preview { display: flex; }
  #panel.streaming .header, #panel.streaming .slot,
  #panel.l3-done .header, #panel.l3-done .slot { display: none; }
  .l3-status {
    font-size: 11px; letter-spacing: 0.4px;
    color: var(--hud-muted);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px;
  }
  .l3-status.streaming::before {
    content: '⚡ ';
    animation: breathe 1.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .l3-body {
    max-height: 140px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.55;
    color: var(--hud-fg);
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 8px 10px;
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text; user-select: text;
  }
  .l3-actions {
    display: none;
    gap: 6px;
    font-size: 11px;
    color: var(--hud-muted);
    padding: 0 4px;
  }
  #panel.l3-done .l3-actions { display: flex; }
  .l3-actions .primary {
    color: var(--hud-ready); font-weight: 600;
  }
  .header {
    font-size: 11px; letter-spacing: 0.4px;
    color: var(--hud-muted);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 4px;
  }
  .slot {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: background 120ms ease;
  }
  .slot .key {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.12);
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    color: var(--hud-fg);
  }
  .slot .label { flex: 1; }
  .slot .shortcut { font-size: 11px; color: var(--hud-muted); }
  .slot.highlighted { background: var(--hud-accent); }
  .slot.highlighted .key { background: rgba(255,255,255,0.22); }
  .slot.highlighted .shortcut { color: rgba(255,255,255,0.85); }
  #ready-text {
    display: none;
    font-size: 13px; font-weight: 600;
    color: var(--hud-ready);
    text-align: center; padding: 12px;
  }
  #panel.ready #ready-text { display: block; }
  #panel.ready .header, #panel.ready .slot { display: none; }
</style>
</head>
<body>
  <div id="panel" role="dialog" aria-label="PasteFlow Micro-HUD">
    <div class="header">
      <span>PasteFlow · 选择格式动作</span>
      <span id="target-app"></span>
    </div>
    <div id="slots"></div>
    <!-- P3-1: L3 流式预览 (UI Spec §3.3 展开态) -->
    <div class="l3-preview">
      <div class="l3-status" id="l3-status">AI 正在生成…</div>
      <div class="l3-body" id="l3-body"></div>
      <div class="l3-actions" id="l3-actions">
        <span class="primary">↩ 确认粘贴</span>
        <span>⌘C 仅复制</span>
        <span>Esc 取消</span>
      </div>
    </div>
    <div id="ready-text">已准备就绪，请按 ⌘V</div>
  </div>

<script type="module">
// Tauri IPC: withGlobalTauri=true -> window.__TAURI__ (无打包器静态页面)
const tauri = window.__TAURI__ ?? {};
const { listen, invoke } = tauri.core ?? {};
const NOOP = async () => {};

const panel = document.getElementById('panel');
const slotsEl = document.getElementById('slots');
const targetApp = document.getElementById('target-app');
const l3Status = document.getElementById('l3-status');
const l3Body = document.getElementById('l3-body');

let actions = [];   // HudActionOptionDto[]
let highlight = 0;  // 默认高亮第 1 项 (UI Spec §3.2)
let sourceText = ''; // 当前复制原文 (L3 输入源)
let l3State = 'idle'; // idle | streaming | done
let l3StreamId = null;

function render() {
  slotsEl.innerHTML = '';
  actions.forEach((a, i) => {
    const row = document.createElement('div');
    row.className = 'slot' + (i === highlight ? ' highlighted' : '');
    row.innerHTML =
      `<span class="key">${a.slotKey}</span>` +
      `<span class="label"></span>` +
      `<span class="shortcut">${a.shortcutHint ?? ''}</span>`;
    row.querySelector('.label').textContent = a.displayName;
    row.addEventListener('click', () => triggerSlot(a.slotKey));
    slotsEl.appendChild(row);
  });
}

function show() {
  panel.classList.remove('ready', 'streaming', 'l3-done');
  panel.classList.add('visible');
  l3State = 'idle';
  highlight = 0;
  render();
}

function hide() {
  panel.classList.remove('visible', 'ready', 'streaming', 'l3-done');
  l3State = 'idle';
  // 托盘宿主窗口隐藏但常驻 (IPC Spec §1: micro-hud 常驻不销毁)
  invoke?.('cmd_hud_visible', { visible: false }).catch(() => {});
}

// —— P3-1: L3 流式动作 (UI Spec §3.3 展开态) ——

function l3PromptTypeFor(slotKey) {
  const a = actions.find(x => x.slotKey === slotKey);
  const m = {
    'builtin.l3-polite-tone': 'POLITE_TONE',
    'builtin.l3-meeting-notes': 'MEETING_NOTES',
    'builtin.l3-comparison-table': 'COMPARISON_TABLE',
    'builtin.l3-todo-list': 'TODO_LIST',
  };
  return m[a?.pipeId ?? ''] ?? 'MEETING_NOTES';
}

async function startL3(slotKey) {
  l3State = 'streaming';
  l3StreamId = null;
  l3Body.textContent = '';
  l3Status.textContent = '⚡ AI 正在生成…';
  l3Status.classList.add('streaming');
  panel.classList.remove('ready', 'l3-done');
  panel.classList.add('streaming');
  try {
    const r = await invoke('cmd_run_l3_stream', {
      promptType: l3PromptTypeFor(slotKey),
      sourceText,
    });
    l3StreamId = r?.streamId ?? null;
  } catch (e) {
    l3Status.classList.remove('streaming');
    l3Status.textContent = '❌ ' + (e?.message ?? e?.code ?? 'L3 启动失败');
  }
}

function cancelL3() {
  if (l3StreamId && l3State === 'streaming') {
    invoke?.('cmd_cancel_l3_stream', { streamId: l3StreamId }).catch(() => {});
  }
  hide();
}

function commitL3() {
  if (!l3StreamId) return;
  invoke?.('cmd_l3_commit_paste', { streamId: l3StreamId })
    .then(() => {
      panel.classList.remove('streaming', 'l3-done');
      panel.classList.add('ready');
      document.getElementById('ready-text').textContent = '已准备就绪，请按 ⌘V';
      setTimeout(hide, 600);
    })
    .catch(() => hide());
}

// L3 流式块事件 (IPC Spec §4 `pasteflow://l3-stream-chunk`)
(listen ?? NOOP)('pasteflow://l3-stream-chunk', (ev) => {
  const p = ev.payload ?? {};
  if (p.streamId !== l3StreamId) return;
  if (p.errorCode) {
    l3Status.classList.remove('streaming');
    l3Status.textContent = '❌ ' + p.errorCode;
    l3State = 'idle';
    return;
  }
  l3Body.textContent = p.accumulatedText ?? '';
  l3Body.scrollTop = l3Body.scrollHeight;
  if (p.done) {
    l3Status.classList.remove('streaming');
    if (l3State === 'streaming') {
      l3State = 'done';
      panel.classList.remove('streaming');
      panel.classList.add('l3-done');
      l3Status.textContent = '✅ 生成完毕 · ' + (p.firstTokenLatencyMs ?? 0) + 'ms 首字';
    }
  }
}).catch(() => {});

function triggerSlot(slotKey) {
  const a = actions.find(x => x.slotKey === slotKey);
  // L3 流式槽位: 进入展开态, 不直接上屏 (UI Spec §3.3)
  if (a?.pipeId?.startsWith('builtin.l3-')) {
    startL3(slotKey);
    return;
  }
  invoke?.('cmd_hud_trigger', { slotKey }).catch(() => {});
  if (slotKey === '0' || slotKey === 'Backspace') {
    panel.classList.remove('visible', 'ready');
    return;
  }
  // Tier 0 上屏反馈: 绿色确认胶囊 600ms (UI Spec §3.2)
  panel.classList.add('ready');
  document.getElementById('ready-text').textContent = '已准备就绪，请按 ⌘V';
  setTimeout(hide, 600);
}

// 按键拦截: 绝不泄漏进宿主应用 (preventDefault + stopPropagation)
window.addEventListener('keydown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  // L3 流式态按键: Esc 取消 / Enter 确认粘贴 / ⌘C 仅复制
  if (l3State === 'streaming' || l3State === 'done') {
    if (e.key === 'Escape') { cancelL3(); return; }
    if (e.key === 'Enter' && l3State === 'done') { commitL3(); return; }
    return; // 其余按键在流式态一律吞掉, 绝不泄漏
  }
  const map = { '1': '1', '2': '2', '3': '3', '4': '4', '0': '0', 'Backspace': 'Backspace' };
  switch (e.key) {
    case 'ArrowUp':
      highlight = (highlight - 1 + Math.max(actions.length, 1)) % Math.max(actions.length, 1);
      render();
      break;
    case 'ArrowDown':
    case 'Tab':
      highlight = (highlight + 1) % Math.max(actions.length, 1);
      render();
      break;
    case 'Enter':
      triggerSlot(actions[highlight]?.slotKey ?? '0');
      break;
    case 'Escape':
      hide(); // 自动挡接管状态不变 (UI Spec §3.2)
      break;
    default:
      if (map[e.key]) triggerSlot(map[e.key]);
  }
}, true);

// 事件接收 (IPC Spec §4 `pasteflow://hud-summoned`)
(listen ?? NOOP)('pasteflow://hud-summoned', (ev) => {
  const p = ev.payload ?? {};
  actions = (p.actions ?? []).map(a => ({
    slotKey: a.slot_key ?? a.slotKey,
    displayName: a.display_name ?? a.displayName ?? a.title,
    pipeId: a.pipe_id ?? a.pipeId,
    shortcutHint: a.shortcut_hint ?? a.shortcutHint ?? a.subtitle,
  }));
  sourceText = p.source_text ?? p.sourceText ?? '';
  targetApp.textContent = p.frontmost_bundle ?? p.frontmostBundle ?? '';
  show();
  (invoke ?? NOOP)('cmd_hud_visible', { visible: true });
}).catch(() => {});
</script>
</body>
</html>
